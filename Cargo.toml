[package]
name = "emu_lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "emu_lib"
path = "src/lib.rs"
crate-type = ["lib"]

[dependencies]
bitfield-struct = "0.8.0"
regex = "1.10.3"
thiserror = "1.0.58"
paste = "1.0.14"
hex-literal = "0.4.1"
serde = {version = "1.0.209", features = ["derive"]}
bincode = { version="1.3.3" }

# Run coverage with `cargo tarpaulin`.
[dev-dependencies]
# The SingleStepTests data, read at run time by tests/singlestep.rs. Only this
# crate's tests use it, so crates that depend on emu_lib never fetch it.
emu_lib_json_tests = { git = "https://github.com/mirage2032/rs_emu_lib_json_tests", rev = "2b93a90190d160e0d92e469c22172f10ef12f256", default-features = false }
libtest-mimic = "0.8"
serde_json = "1.0.127"

[[test]]
name = "singlestep"
harness = false
